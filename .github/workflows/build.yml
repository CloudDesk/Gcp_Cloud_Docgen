name: Build

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set environment variables
        run: |
          echo "PORT=${{ secrets.PORT }}" >> $GITHUB_ENV
          echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
          echo "SF_ORG_ID=${{ secrets.SF_ORG_ID }}" >> $GITHUB_ENV
          echo "SF_USERNAME=${{ secrets.SF_USERNAME }}" >> $GITHUB_ENV
          echo "SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}" >> $GITHUB_ENV
          echo "SERVICE_ACCOUNT=${{ secrets.SERVICE_ACCOUNT }}" >> $GITHUB_ENV
          echo "SF_ORG_ID_TWO=${{ secrets.SF_ORG_ID_TWO }}" >> $GITHUB_ENV
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_ENV
          echo "TEST_BASE_URL=${{ secrets.TEST_BASE_URL }}" >> $GITHUB_ENV
          echo "DOCGEN_API_KEY=${{ secrets.DOCGEN_API_KEY }}" >> $GITHUB_ENV

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          sudo apt-get install -y libreoffice-writer

      - name: Install Dependencies
        run: npm install

      - name: Run Jest Tests
        run: npm test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for SonarCloud Quality Gate
        uses: actions/github-script@v6
        id: check_quality_gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          script: |
            const projectKey = 'CloudDesk_Gcp_Cloud_Docgen';
            const response = await fetch(`https://sonarcloud.io/api/qualitygates/project_status?projectKey=${projectKey}`, {
              headers: {
                'Authorization': `Basic ${Buffer.from(process.env.SONAR_TOKEN + ':').toString('base64')}`,
              },
            });

            if (!response.ok) {
              throw new Error(`Failed to fetch SonarCloud Quality Gate status: ${response.statusText}`);
            }

            const data = await response.json();
            const status = data.projectStatus.status;

            if (status === 'ERROR') {
              console.log(`SonarCloud Quality Gate failed with status: ${status}`);
              console.log('Conditions:', data.projectStatus.conditions);
              core.setFailed('SonarCloud Quality Gate did not meet the required conditions.');
            } else if (status === 'OK') {
              console.log('SonarCloud Quality Gate passed.');
            } else {
              console.log(`Unexpected SonarCloud Quality Gate status: ${status}`);
              core.setFailed(`Unexpected status: ${status}`);
            }

      - name: Cleanup SonarCloud artifacts
        if: success()
        run: |
          sudo rm -rf .scannerwork/
          git clean -fd

       - name: Merge to test branch
        if: success() && github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git with token-based authentication
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Fetch all branches
          git fetch origin
          
          # Backup current state
          git stash
          
          # Switch to dev branch and get latest
          git checkout dev
          git pull origin dev
          
          # Create or reset test branch to match dev
          git checkout -B test
          
          # Remove unwanted files and directories
          rm -rf .github/workflows/build.yaml || true
          rm -rf src/test || true
          
          # Stage deletions
          git add -u
          
          # Create/update .gitignore if needed
          if ! grep -q ".github/workflows/build.yaml" .gitignore; then
            echo ".github/workflows/build.yaml" >> .gitignore
          fi
          if ! grep -q "src/test/" .gitignore; then
            echo "src/test/" >> .gitignore
          fi
          
          # Stage .gitignore changes
          git add .gitignore
          
          # Commit changes if there are any
          git diff --staged --quiet || git commit -m "Prepare test branch (excluding build.yaml and test directory)"
          
          # Push to test branch using token authentication
          git remote set-url origin "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin test