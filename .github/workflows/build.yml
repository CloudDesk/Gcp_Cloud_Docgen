name: Build

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures the full history for better analysis



      - name: Generate environment variable file for Cloud Run
        run: |
          echo "PORT=${{ secrets.PORT }}" >> $GITHUB_WORKSPACE/env.list
          echo "dockgen_apikey=${{ secrets.API_KEY }}" >> $GITHUB_WORKSPACE/env.list
          echo "SF_ORG_ID=${{ secrets.SF_ORG_ID }}" >> $GITHUB_WORKSPACE/env.list
          echo "SF_ORG_ID_TWO=${{ secrets.SF_ORG_ID_TWO }}" >> $GITHUB_WORKSPACE/env.list
          echo "SF_USERNAME=${{ secrets.SF_USERNAME }}" >> $GITHUB_WORKSPACE/env.list
          echo "SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}" >> $GITHUB_WORKSPACE/env.list
          echo "SERVICE_ACCOUNT=${{ secrets.SERVICE_ACCOUNT }}" >> $GITHUB_WORKSPACE/env.list
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_WORKSPACE/env.list
          echo "TEST_BASE_URL=${{ secrets.TEST_BASE_URL }}" >> $GITHUB_WORKSPACE/env.list
       env:
          GITHUB_ENV: ${{ github.env }}


      # Step 2: Set environment variables (using GitHub Secrets)
      - name: Set environment variables
        run: |
          echo "PORT=${{ secrets.PORT }}" >> $GITHUB_ENV
          echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
          echo "SF_ORG_ID=${{ secrets.SF_ORG_ID }}" >> $GITHUB_ENV
          echo "SF_USERNAME=${{ secrets.SF_USERNAME }}" >> $GITHUB_ENV
          echo "SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}" >> $GITHUB_ENV
          echo "SERVICE_ACCOUNT=${{ secrets.SERVICE_ACCOUNT }}" >> $GITHUB_ENV
          echo "SF_ORG_ID_TWO=${{ secrets.SF_ORG_ID_TWO }}" >> $GITHUB_ENV
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_ENV
          echo "TEST_BASE_URL=${{ secrets.TEST_BASE_URL }}" >> $GITHUB_ENV

      # Step 3: Create GCP credentials file
      - name: Create GCP credentials file
        run: |
          echo "${{ secrets.GCP_CREDENTIALS_JSON }}" > "$GITHUB_WORKSPACE/docgen-440809-afae407a4dd7.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/docgen-440809-afae407a4dd7.json" >> $GITHUB_ENV

      # Step 4: Install libreoffice
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          sudo apt-get install -y libreoffice-writer

      # Step 5: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 6: Run Jest Tests with Coverage
      - name: Run Jest Tests
        run: npm test -- --coverage

        

      # Step 7: Run SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 8: Wait for SonarCloud Quality Gate status
      - name: Wait for SonarCloud Quality Gate
        uses: actions/github-script@v6
        id: check_quality_gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          script: |
            const projectKey = 'CloudDesk_Gcp_Cloud_Docgen'; // Replace with your project key
            const response = await fetch(`https://sonarcloud.io/api/qualitygates/project_status?projectKey=${projectKey}`, {
            headers: {
                'Authorization': `Basic ${Buffer.from(process.env.SONAR_TOKEN + ':').toString('base64')}`,
            },
            });

            if (!response.ok) {
              throw new Error(`Failed to fetch SonarCloud Quality Gate status: ${response.statusText}`);
            }

            const data = await response.json();
            console.log('SonarCloud API Response:', data); // Debugging the response
            console.log('SonarCloud API Response:', data.projectStatus.periods); // Debugging the response
            console.log('SonarCloud Quality Gate status:', JSON.stringify(data, null, 2));
            const status = data.projectStatus.status;

            if (status === 'ERROR') {
              console.log(`SonarCloud Quality Gate failed with status: ${status}`);
              console.log('Conditions:', data.projectStatus.conditions);
              core.setFailed('SonarCloud Quality Gate did not meet the required conditions.');
            } else if (status === 'OK') {
              console.log('SonarCloud Quality Gate passed.');
            } else {
              console.log(`Unexpected SonarCloud Quality Gate status: ${status}`);
              core.setFailed(`Unexpected status: ${status}`);
            }
    

      # Add cleanup step
      - name: Cleanup SonarCloud artifacts
        if: success()
        run: |
          sudo rm -rf .scannerwork/
          git clean -fd


       # New approach: Direct merge to test branch with conflict resolution
      - name: Merge to test branch
        if: success() && github.ref == 'refs/heads/dev'
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Fetch all branches
          git fetch origin
          
          # Clean any leftover files
          git clean -fd
          
          # Create backup of credentials file if it exists
          if [ -f "src/service/gcp/gcp-credentials.json" ]; then
            cp src/service/gcp/gcp-credentials.json /tmp/gcp-credentials.json
          fi
          
          # Force reset to dev branch state
          git reset --hard origin/dev
          
          # Restore credentials file if it existed
          if [ -f "/tmp/gcp-credentials.json" ]; then
            mkdir -p src/service/gcp/
            cp /tmp/gcp-credentials.json src/service/gcp/gcp-credentials.json
          fi
          
          # Push to test branch
          git push origin HEAD:test --force