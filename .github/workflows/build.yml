name: Build and Sync to Test

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_and_analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set environment variables (using GitHub Secrets)
      - name: Set environment variables
        run: |
          echo "PORT=${{ secrets.PORT }}" >> $GITHUB_ENV
          echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
          echo "SF_ORG_ID=${{ secrets.SF_ORG_ID }}" >> $GITHUB_ENV
          echo "SF_USERNAME=${{ secrets.SF_USERNAME }}" >> $GITHUB_ENV
          echo "SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}" >> $GITHUB_ENV
          echo "SERVICE_ACCOUNT=${{ secrets.SERVICE_ACCOUNT }}" >> $GITHUB_ENV
          echo "SF_ORG_ID_TWO=${{ secrets.SF_ORG_ID_TWO }}" >> $GITHUB_ENV

      # Step 3: Create GCP credentials file
      - name: Create GCP credentials file
        run: |
          echo "${{ secrets.GCP_CREDENTIALS_JSON }}" > "$GITHUB_WORKSPACE/docgen-440809-afae407a4dd7.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/docgen-440809-afae407a4dd7.json" >> $GITHUB_ENV

      # Step 4: Install LibreOffice
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          sudo apt-get install -y libreoffice-writer

      # Step 5: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 6: Run Jest Tests with Coverage
      - name: Run Jest Tests
        run: npm test -- --coverage

      # Step 7: Run SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: false  # Optional, to emphasize failure stops the job

  sync_to_test:
    name: Sync Dev to Test Branch
    runs-on: ubuntu-latest
    needs: build_and_analyze
    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Git user
      - name: Set Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Step 3: Fetch the latest 'test' branch
      - name: Fetch Remote Branches
        run: |
          git fetch origin test

      # Step 4: Create a pull request from 'dev' to 'test'
      - name: Create Pull Request from Dev to Test
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev
          base: test
          title: "Sync Dev to Test"
          body: |
            Automatically created PR to sync changes from `dev` to `test` branch.
            Please review and merge.

      # Step 5: Notify Success
      - name: Notify Sync Success
        run: echo "Successfully synced 'dev' branch to 'test' branch!"
