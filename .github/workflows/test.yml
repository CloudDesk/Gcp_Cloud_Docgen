
name: Test Deployment

on:
  push:
    branches:
      - test  # Trigger workflow when changes are pushed to the `test` branch

jobs:
  deploy:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures the full history for better analysis

      # Step 2: Set environment variables (using GitHub Secrets)
      - name: Set environment variables
        run: |
          echo "PORT=${{ secrets.PORT }}" >> $GITHUB_ENV
          echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
          echo "SF_ORG_ID=${{ secrets.SF_ORG_ID }}" >> $GITHUB_ENV
          echo "SF_USERNAME=${{ secrets.SF_USERNAME }}" >> $GITHUB_ENV
          echo "SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}" >> $GITHUB_ENV
          echo "SERVICE_ACCOUNT=${{ secrets.SERVICE_ACCOUNT }}" >> $GITHUB_ENV
          echo "SF_ORG_ID_TWO=${{ secrets.SF_ORG_ID_TWO }}" >> $GITHUB_ENV

      # Step 3: Install LibreOffice (if required)
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          sudo apt-get install -y libreoffice-writer

      # Step 4: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 5: Run Jest Tests (optional but useful for testing the code)
      - name: Run Jest Tests
        run: npm test -- --coverage

      # Step 6: Build and Push Docker image to Google Container Registry (GCR)
      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/docgen-440809/docgen-testenv:latest .
          docker push gcr.io/docgen-440809/docgen-testenv:latest

      # Step 7: Deploy Docker Image to Cloud Run (Staging)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy your-service-name  # Replace with your Cloud Run service name
          --image=gcr.io/docgen-440809/docgen-testenv:latest
          --region=us-central1  # Replace with your region
          --platform=managed
          --allow-unauthenticated  # Optional: Remove if authentication is required

      # Step 8: (Optional) Run SonarCloud Scan again for the test branch
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 9: Cleanup
      - name: Cleanup SonarCloud artifacts
        if: success()
        run: |
          sudo rm -rf .scannerwork/
          git clean -fd
