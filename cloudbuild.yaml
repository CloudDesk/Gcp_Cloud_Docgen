steps:
  # Step 1: Authenticate with GCP using Service Account stored in Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Fetch the service account key from Secret Manager
        gcloud secrets versions access latest --secret="docgen-service-account-key" > /workspace/gcp-key.json
        gcloud auth activate-service-account --key-file=/workspace/gcp-key.json

  # Step 2: Set GCP project
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'config'
      - 'set'
      - 'project'
      - 'docgen-440809'  # Replace with your GCP project ID

  # Step 3: Fetch environment variables from Secret Manager and store them in files for later use
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Fetch secrets from Secret Manager and export as environment variables
        export PORT=$(gcloud secrets versions access latest --secret="PORT")
        export API_KEY=$(gcloud secrets versions access latest --secret="docgen_apikey")
        export SF_ORG_ID=$(gcloud secrets versions access latest --secret="SF_ORG_ID")
        export SF_USERNAME=$(gcloud secrets versions access latest --secret="SF_USERNAME")
        export SF_CLIENT_ID=$(gcloud secrets versions access latest --secret="SF_CLIENT_ID")
        export SERVICE_ACCOUNT=$(gcloud secrets versions access latest --secret="SERVICE_ACCOUNT")
        export SF_ORG_ID_TWO=$(gcloud secrets versions access latest --secret="SF_ORG_ID_TWO")
        export BASE_URL=$(gcloud secrets versions access latest --secret="TEST_BASE_URL")
        
        # Store the environment variables in a file to use later
        echo "PORT=$PORT" >> /workspace/env-vars.txt
        echo "API_KEY=$API_KEY" >> /workspace/env-vars.txt
        echo "SF_ORG_ID=$SF_ORG_ID" >> /workspace/env-vars.txt
        echo "SF_USERNAME=$SF_USERNAME" >> /workspace/env-vars.txt
        echo "SF_CLIENT_ID=$SF_CLIENT_ID" >> /workspace/env-vars.txt
        echo "SERVICE_ACCOUNT=$SERVICE_ACCOUNT" >> /workspace/env-vars.txt
        echo "SF_ORG_ID_TWO=$SF_ORG_ID_TWO" >> /workspace/env-vars.txt
        echo "BASE_URL=$BASE_URL" >> /workspace/env-vars.txt

  # Step 4: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/docgen-440809/docgen-testenv:latest'  # Replace with your service name
      - '.'

  # Step 5: Push Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/docgen-440809/docgen-testenv:latest'

  # Step 6: Check if Cloud Run service exists, create or deploy accordingly
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        REGION="us-central1"  # Replace with your region, e.g., us-central1

        # Dynamically generate a service name (e.g., use a timestamp or project ID)
        SERVICE_NAME="docgen-service-$(date +'%Y%m%d%H%M%S')"  # Dynamic service name based on timestamp
        
        # Check if the Cloud Run service exists
        gcloud run services describe $SERVICE_NAME --region $REGION &> /dev/null
        
        if [ $? -eq 0 ]; then
          # Service exists, redeploy the existing service
          echo "Service exists, redeploying..."
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/docgen-440809/docgen-testenv:latest \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars $(cat /workspace/env-vars.txt | xargs)
        else
          # Service doesn't exist, create a new one
          echo "Service does not exist, creating a new one..."
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/docgen-440809/docgen-testenv:latest \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars $(cat /workspace/env-vars.txt | xargs)
        fi

options:
  logging: CLOUD_LOGGING_ONLY  # Specify logging option (to avoid logs_bucket error)
