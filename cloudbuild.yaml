steps:
  # Step 1: Export Environment Variables and Authenticate
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    env:
      - 'API_KEY=${API_KEY}'
      - 'SF_ORG_ID=${SF_ORG_ID}'
      - 'SF_USERNAME=${SF_USERNAME}'
      - 'SF_CLIENT_ID=${SF_CLIENT_ID}'
      - 'SERVICE_ACCOUNT=${SERVICE_ACCOUNT}'
      - 'SF_ORG_ID_TWO=${SF_ORG_ID_TWO}'
      - 'BASE_URL=${BASE_URL}'
      - 'TEST_BASE_URL=${TEST_BASE_URL}'
      - 'TEST_DATA=${TEST_DATA}'
    args:
      - '-c'
      - |
        echo "Authenticating with GCP..."
        gcloud secrets versions access latest --secret="docgen-service-account-key" > /workspace/gcp-key.json
        gcloud auth activate-service-account --key-file=/workspace/gcp-key.json
        
        # Verify environment variables are set (optional, for debugging)
        echo "Deploying with:"
        echo "PORT: $PORT"
        echo "API_KEY: ${API_KEY:0:4}********"  # Partially mask sensitive info

  # Step 2: Deploy to Cloud Run using environment variables
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    env:
      - 'API_KEY=${API_KEY}'
      - 'SF_ORG_ID=${SF_ORG_ID}'
      - 'SF_USERNAME=${SF_USERNAME}'
      - 'SF_CLIENT_ID=${SF_CLIENT_ID}'
      - 'SERVICE_ACCOUNT=${SERVICE_ACCOUNT}'
      - 'SF_ORG_ID_TWO=${SF_ORG_ID_TWO}'
      - 'BASE_URL=${BASE_URL}'
      - 'TEST_BASE_URL=${TEST_BASE_URL}'
      - 'TEST_DATA=${TEST_DATA}'
    args:
      - '-c'
      - |
        gcloud run deploy docgen-service \
          --image gcr.io/docgen-440809/docgen-testenv:latest \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --port 4450 \
          --set-env-vars API_KEY=$API_KEY,SF_ORG_ID=$SF_ORG_ID,SF_USERNAME=$SF_USERNAME,SF_CLIENT_ID=$SF_CLIENT_ID,SERVICE_ACCOUNT=$SERVICE_ACCOUNT,SF_ORG_ID_TWO=$SF_ORG_ID_TWO,BASE_URL=$BASE_URL,TEST_BASE_URL=$TEST_BASE_URL,TEST_DATA=$TEST_DATA

options:
  logging: CLOUD_LOGGING_ONLY