steps:
  # Step 1: Authenticate with GCP using Service Account stored in Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Fetch the service account key from Secret Manager (if needed)
        gcloud secrets versions access latest --secret="docgen-service-account-key" > /workspace/gcp-key.json
        gcloud auth activate-service-account --key-file=/workspace/gcp-key.json

  # Step 2: Set GCP project
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'config'
      - 'set'
      - 'project'
      - 'docgen-440809'  # Replace with your GCP project ID

  # Step 3: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/docgen-440809/docgen-testenv:latest'  # Replace with your image name
      - '.'

  # Step 4: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/docgen-440809/docgen-testenv:latest'

  # Step 5: Run the npm build (just to test)
  - name: 'gcr.io/cloud-builders/npm'
    args:
      - 'run'
      - 'build'

  # Step 6: Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'docgen-service'  # Use your Cloud Run service name here
      - '--image'
      - 'gcr.io/docgen-440809/docgen-testenv:latest'
      - '--region'
      - 'us-central1'  # Replace with your desired region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # Optional: Remove if authentication is required
      - '--port'
      - '4450'  # Replace with the port your app is listening on

options:
  logging: CLOUD_LOGGING_ONLY  # Ensure proper logging configuration
